name: Rename to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename file
        run: |
          pwd
          ls -la
          git ls-files
          git status
          git config user.name "Ito8880"
          git config user.email "Ito8880@users.noreply.github.com"
          git mv bang-tong-risupotutosaito.html index.html
          git commit -m "Rename bang-tong-risupotutosaito.html to index.html"
          git push
